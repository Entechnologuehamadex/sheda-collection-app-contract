[package]
name = "sheda-collection-vault"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Entechnologuehamadex/sheda-collection-app-contract"
description = "Fractional ownership of a single property unit, with rent split among its holders."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `legacy` carries near_sdk::collections. The newer `store` collections buffer
# writes and hand back references rather than values, which changes every call
# site here; this crate uses the stable ones deliberately and can migrate as
# its own change rather than as a side effect of a version bump.
near-sdk = { version = "5.5", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.5", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
